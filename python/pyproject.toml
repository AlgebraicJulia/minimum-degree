[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minimum-degree"
version = "0.1.0"
description = "The exact minimum degree algorithm"
requires-python = ">=3.8"
dependencies = ["numpy"]

[project.optional-dependencies]
scipy = ["scipy"]
test = ["pytest", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]
